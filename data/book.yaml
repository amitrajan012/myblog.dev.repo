# status: published (has blog posts) | drafted | planned
title: "Counting to Intelligence"
subtitle: "How Simple Mathematics Becomes Machine Learning"
tagline: "The math is smaller than the magic. It is just counting, repeated until it looks like thought."
audience: "Written for curious readers, technical leaders, and hands-on builders who prefer clear mental models over dense notation."
about: "Long before machine learning became a web of dense matrices and hundred-billion-parameter neural networks, it began with an operation every human understands: counting.\n\nCounting to Intelligence does not strip the mathematics out of modern AI—it puts it where it belongs. By leading with physical intuition, equations arrive only as the precise tools needed to solve failures you’ve already seen unfold.\n\nWritten for curious readers, technical leaders, and hands-on builders who prefer clear mental models over dense notation, this book charts the path from simple ratios of counts to systems that seem to think. It shows how the most basic mathematical principles scale into the technology reshaping our world.\n\nThe math is smaller than the magic. It is just counting, repeated until it looks like thought."
