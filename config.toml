baseurl = "https://amitrajan012.github.io"
title = "Amit Rajan"
theme = "notebook"   # previous theme: "hugo-theme-cleanwhite"
languageCode = "en-us"

enableRobotsTXT = true

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "llms"]   # index.json powers site search; llms.txt is a plain-text map for AI tools

[taxonomies]
  tag = "tags"
  category = "categories"
  topic = "topics"

[permalinks]
  [permalinks.page]
    book-blog = "/book/blog/:slug/"

[pagination]
  pagerSize = 5000 # frontpage pagination (replaces removed `paginate`)

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  header_image = "img/head.jpg"
  title = "Software Engineering"
  slogan = "Machine Learning | Blockchain"
  SEOTitle = "Amit Rajan Blog"
  keyword = "Amit, Rajan, ML, Data, Science, Blockchain"

  # Sidebar settings
  sidebar_about_description = "Data Scientist, Reader"
  sidebar_avatar = "img/a.png"
  about_me = true

  featured_tags = true 
  featured_condition_size = 2 # How many posts have to have a given tag to be featured (greater-than)

  # image_404 = "img/404-bg.jpg"
  title_404 = "We couldn't find what you were looking for..."

  omit_categories = false

  [[params.addtional_menus]]
  title =  "ABOUT"
  href =  "/about/"

  [params.social]
  rss            = true
  email          = "amitrajan012@gmail.com"
  linkedin       = "https://www.linkedin.com/in/amit-rajan-1343aaba/"
  github         = "https://github.com/amitrajan012"

# ---- search engines ----
# Paste the codes from Google Search Console / Bing Webmaster Tools ("HTML tag" verification).
[params.verification]
  google = ""
  bing = ""

# ---- notebook theme ----
[params.notebook]
  author = "Amit Rajan"
  jobTitle = "Head of Engineering"
  intro = "I’m Amit—Head of Engineering, currently leading the build of an agentic AI platform that reads, understands and validates documents at enterprise scale. My background is in ML and data science, and these pages contain my chapter-by-chapter notes and complete derivations for the foundational textbooks behind modern AI: Bishop, Strang, ISLR, and Think Stats."
  introBook = "Currently, I’m turning these working notes into my own book, [Counting to Intelligence](/book/)."
  bio = "Head of Engineering, leading the build of an agentic AI platform that reads, understands and validates documents at enterprise scale — teams of AI agents doing work that once took whole back offices. Before that, I spent years in the weeds as a machine learning engineer and data scientist."
  recentCount = 12
  # Shown under the home search box before anything is typed
  searchSuggestions = ["Bayes theorem", "Kernel methods", "Eigenvalues", "Gradient descent", "Hypothesis testing", "Support vector machines", "Expectation maximization"]

[params.book]
  # Set to true once data/book.yaml has your real title and contents.
  enabled = true
