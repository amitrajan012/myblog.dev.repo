{{- $c := .color -}}
{{- if eq .icon "curve" -}}
<svg width="100%" height="70" viewBox="0 0 200 70" fill="none" stroke="{{ $c }}" stroke-width="2" aria-hidden="true"><path d="M0 68 C40 68 50 10 70 10 C90 10 95 50 110 50 C125 50 135 22 150 22 C170 22 175 68 200 68"/></svg>
{{- else if eq .icon "triangle" -}}
<svg width="120" height="76" viewBox="0 0 120 84" fill="none" stroke="{{ $c }}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 74 L60 10 L110 74 Z"/><path d="M60 10 L60 74"/><path d="M10 74 L85 42"/></svg>
{{- else if eq .icon "scatter" -}}
<svg width="140" height="76" viewBox="0 0 140 84" fill="{{ $c }}" stroke="{{ $c }}" stroke-width="2" aria-hidden="true"><circle cx="20" cy="60" r="4"/><circle cx="38" cy="50" r="4"/><circle cx="52" cy="56" r="4"/><circle cx="70" cy="38" r="4"/><circle cx="88" cy="34" r="4"/><circle cx="104" cy="22" r="4"/><circle cx="122" cy="18" r="4"/><path d="M10 68 L130 12" fill="none"/></svg>
{{- else -}}
<svg width="120" height="76" viewBox="0 0 120 76" fill="{{ $c }}" aria-hidden="true"><rect x="10" y="56" width="14" height="20" rx="2"/><rect x="28" y="34" width="14" height="42" rx="2"/><rect x="46" y="6" width="14" height="70" rx="2"/><rect x="64" y="20" width="14" height="56" rx="2"/><rect x="82" y="46" width="14" height="30" rx="2"/><rect x="100" y="64" width="14" height="12" rx="2"/></svg>
{{- end -}}
