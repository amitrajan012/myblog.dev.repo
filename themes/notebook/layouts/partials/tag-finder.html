{{- /* Type-to-filter box over every tag. Params: id, hide (selector shown only when the box is empty), always (true = list always visible) */ -}}
<div class="tag-finder" data-tag-finder{{ with .hide }} data-hide="{{ . }}"{{ end }}>
  <label for="{{ .id }}" class="sr-only">Find a topic</label>
  <div class="find-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="{{ .id }}" type="search" placeholder="Find a topic — e.g. eigen, bayes, svm" autocomplete="off">
  </div>
  <div class="chips tag-results"{{ if not .always }} hidden{{ end }}>
    {{ range site.Taxonomies.tags.ByCount }}<a class="tag" data-name="{{ lower .Page.Title }}" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="count">{{ .Count }}</span></a>{{ end }}
  </div>
  <p class="tag-none muted small" hidden>No topic matches. <a href="{{ "/search/" | relURL }}" data-search-link>Search all notes for it →</a></p>
</div>
