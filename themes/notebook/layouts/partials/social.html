{{ with site.Params.social }}
<div class="social">
  {{ with .github }}<a href="{{ . }}" aria-label="GitHub"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5a3 3 0 0 0-.9-2.4c3-.3 6-1.5 6-6.6a5 5 0 0 0-1.4-3.6 4.7 4.7 0 0 0-.1-3.6s-1.1-.3-3.6 1.4a12.5 12.5 0 0 0-6.5 0C6 1.6 4.9 1.9 4.9 1.9a4.7 4.7 0 0 0-.1 3.6A5 5 0 0 0 3.4 9c0 5.1 3 6.3 6 6.6a3 3 0 0 0-.9 2.4V21"/></svg></a>{{ end }}
  {{ with .linkedin }}<a href="{{ . }}" aria-label="LinkedIn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg></a>{{ end }}
  {{ with .email }}<a href="mailto:{{ . }}" aria-label="Email"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></a>{{ end }}
  {{ if .rss }}<a href="{{ "/index.xml" | relURL }}" aria-label="RSS feed"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg></a>{{ end }}
</div>
{{ end }}
